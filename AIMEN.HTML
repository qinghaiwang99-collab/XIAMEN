<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>廈門印象｜XIAMEN MEMORIES</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fafafa;
            font-family: 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            overflow: hidden;
            user-select: none;
            height: 100vh;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 32px 24px 24px;
            text-align: center;
            z-index: 1000;
            background: linear-gradient(to bottom, #fafafa 50%, transparent);
            pointer-events: none;
        }

        .header h1 {
            font-size: clamp(28px, 5vw, 38px);
            font-weight: 300;
            letter-spacing: 0.15em;
            color: #1a1a1a;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .header p {
            font-size: clamp(13px, 2.5vw, 15px);
            color: #999;
            letter-spacing: 0.1em;
            font-weight: 300;
        }

        .gallery-viewport {
            position: fixed;
            top: 50%;
            left: 0;
            width: 100%;
            height: 320px;
            transform: translateY(-50%);
            overflow: hidden;
            cursor: grab;
        }

        .gallery-viewport:active {
            cursor: grabbing;
        }

        .gallery-track {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateX(0px);
            display: flex;
            align-items: center;
            height: 100%;
            will-change: transform;
        }

        .photo-card {
            flex-shrink: 0;
            width: clamp(180px, 28vw, 220px);
            height: clamp(240px, 38vw, 300px);
            margin: 0 clamp(16px, 3vw, 24px);
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08), 0 8px 16px rgba(0,0,0,0.04);
            border: 10px solid white;
            border-bottom-width: 48px;
            overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1), box-shadow 0.35s ease;
            pointer-events: auto;
        }

        .photo-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 50px rgba(0,0,0,0.15), 0 12px 20px rgba(0,0,0,0.08);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 92vw;
            max-height: 88vh;
        }

        .lightbox-content img {
            max-width: 80vw;
            max-height: 80vh;
            background: #fff;
            padding: 12px;
            padding-bottom: 55px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            border-radius: 6px;
            object-fit: contain;
        }

        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 24px;
            line-height: 44px;
            text-align: center;
            cursor: pointer;
            z-index: 2100;
            transition: background 0.2s;
        }

        .arrow:hover {
            background: rgba(255,255,255,0.3);
        }

        .arrow-left {
            left: -60px;
        }

        .arrow-right {
            right: -60px;
        }

        .lightbox-close {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 28px;
            line-height: 42px;
            text-align: center;
            cursor: pointer;
            z-index: 2100;
            display: none;
        }

        .lightbox-close.visible {
            display: block;
        }

        .hint {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: #bbb;
            font-size: 13px;
            letter-spacing: 0.1em;
            pointer-events: none;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(4px);
            padding: 6px 18px;
            border-radius: 20px;
        }

        @media (max-width: 768px) {
            .gallery-viewport {
                height: 280px;
            }
            .photo-card {
                border-width: 6px;
                border-bottom-width: 34px;
            }
            .header {
                padding: 20px 16px 16px;
            }
            .arrow {
                width: 36px;
                height: 36px;
                font-size: 20px;
                line-height: 36px;
            }
            .arrow-left {
                left: -40px;
            }
            .arrow-right {
                right: -40px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Xiamen Memories</h1>
        
    </div>

    <div class="gallery-viewport" id="viewport">
        <div class="gallery-track" id="track"></div>
    </div>

    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <button class="arrow arrow-left" id="prev-btn">‹</button>
            <img src="" alt="完整照片" id="lightbox-img">
            <button class="arrow arrow-right" id="next-btn">›</button>
        </div>
    </div>
    <button class="lightbox-close" id="lightbox-close" aria-label="關閉">✕</button>

  

    <script>
        const track = document.getElementById('track');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxClose = document.getElementById('lightbox-close');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        const imageFiles = [
            '微信圖片_20260620150647_9_4.jpg',
            '微信圖片_20260620150648_10_4.jpg',
            '微信圖片_20260620150650_11_4.jpg',
            '微信圖片_20260620150652_12_4.jpg',
            '微信圖片_20260620150653_13_4.jpg',
            '微信圖片_20260620150655_14_4.jpg',
            '微信圖片_20260620150656_15_4.jpg',
            '微信圖片_20260620150658_16_4.jpg',
            '微信圖片_20260620150659_17_4.jpg',
            '微信圖片_20260620150701_18_4.jpg',
            '微信圖片_20260620150702_19_4.jpg',
            '微信圖片_20260620152441_3_5.jpg',
            '微信圖片_20260620152445_4_5.jpg',
            '微信圖片_20260620152447_5_5.jpg',
            '微信圖片_20260620152451_6_5.jpg',
            '微信圖片_20260620152454_7_5.jpg'
        ];

        let currentIndex = 0;

        let offsetX = 0;
        const speed = 0.7;
        let isDragging = false;
        let startX = 0;
        let startOffset = 0;
        let rafId = null;
        let cycleWidth = 0;
        let wheelTicking = false;

        const placeholder = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22300%22%3E%3Crect fill=%22%23e0e0e0%22 width=%22200%22 height=%22300%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22 font-family=%22sans-serif%22 font-size=%2216%22%3E載入失敗%3C/text%3E%3C/svg%3E';

        function createCard(src) {
            const card = document.createElement('div');
            card.className = 'photo-card';
            const img = document.createElement('img');
            img.src = src;
            img.alt = '廈門回憶';
            img.draggable = false;
            img.onerror = () => { img.src = placeholder; };
            card.appendChild(img);

            card.addEventListener('click', (e) => {
                if (isDragging) return;
                currentIndex = imageFiles.indexOf(src);
                if (currentIndex === -1) currentIndex = 0;
                lightboxImg.src = src;
                lightbox.classList.add('active');
                lightboxClose.classList.add('visible');
            });

            return card;
        }

        imageFiles.forEach(src => track.appendChild(createCard(src)));
        imageFiles.forEach(src => track.appendChild(createCard(src)));

        function calculateCycleWidth() {
            const cards = Array.from(track.children);
            const originalCount = imageFiles.length;
            if (cards.length === 0) return 1000;
            let width = 0;
            for (let i = 0; i < originalCount; i++) {
                const card = cards[i];
                const style = getComputedStyle(card);
                width += card.offsetWidth + parseFloat(style.marginLeft) + parseFloat(style.marginRight);
            }
            return width;
        }

        cycleWidth = calculateCycleWidth();

        function updatePosition() {
            track.style.transform = `translate(-50%, -50%) translateX(${offsetX}px)`;
        }

        function animate() {
            if (!isDragging && !lightbox.classList.contains('active')) {
                offsetX -= speed;
                if (offsetX <= -cycleWidth / 2) offsetX += cycleWidth;
                if (offsetX > cycleWidth / 2) offsetX -= cycleWidth;
                updatePosition();
            }
            rafId = requestAnimationFrame(animate);
        }

        track.addEventListener('pointerdown', (e) => {
            if (lightbox.classList.contains('active')) return;
            isDragging = true;
            startX = e.clientX;
            startOffset = offsetX;
            track.setPointerCapture(e.pointerId);
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            offsetX = startOffset + dx;
            if (offsetX <= -cycleWidth / 2) offsetX += cycleWidth;
            if (offsetX > cycleWidth / 2) offsetX -= cycleWidth;
            updatePosition();
        });

        window.addEventListener('pointerup', () => {
            if (isDragging) {
                isDragging = false;
                track.releasePointerCapture?.(0);
            }
        });

        track.addEventListener('wheel', (e) => {
            if (lightbox.classList.contains('active')) return;
            e.preventDefault();
            offsetX -= e.deltaY * 0.9;
            // 替换原有的边界判断
            if (offsetX <= -cycleWidth / 2) offsetX += cycleWidth;
            if (offsetX > cycleWidth / 2) offsetX -= cycleWidth;

            if (!wheelTicking) {
                requestAnimationFrame(() => {
                    updatePosition();
                    wheelTicking = false;
                });
                wheelTicking = true;
            }
        }, { passive: false });

        function showImage(index) {
            currentIndex = (index + imageFiles.length) % imageFiles.length;
            lightboxImg.src = imageFiles[currentIndex];
        }

        function openLightbox(src) {
            currentIndex = imageFiles.indexOf(src);
            if (currentIndex === -1) currentIndex = 0;
            lightboxImg.src = src;
            lightbox.classList.add('active');
            lightboxClose.classList.add('visible');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            lightboxClose.classList.remove('visible');
        }

        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            showImage(currentIndex - 1);
        });

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            showImage(currentIndex + 1);
        });

        lightboxClose.addEventListener('click', closeLightbox);

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') {
                closeLightbox();
            } else if (e.key === 'ArrowLeft') {
                showImage(currentIndex - 1);
            } else if (e.key === 'ArrowRight') {
                showImage(currentIndex + 1);
            }
        });

        window.addEventListener('resize', () => {
            cycleWidth = calculateCycleWidth();
            if (offsetX <= -cycleWidth / 2) offsetX += cycleWidth;
            if (offsetX > cycleWidth / 2) offsetX -= cycleWidth;
            updatePosition();
        });

        animate();
    </script>
</body>
</html>
